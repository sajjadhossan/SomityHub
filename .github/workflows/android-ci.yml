name: Android App CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: apps/mobile
        run: |
          flutter create --platforms=android --org com.somityhub --project-name app .
          sed -i 's/android:label="app"/android:label="SomityHub"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run widget tests
        working-directory: apps/mobile
        run: flutter test
