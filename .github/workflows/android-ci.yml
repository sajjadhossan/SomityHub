name: Android App CI

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: apps/mobile
        run: |
          flutter create --platforms=android --org com.somityhub --project-name app .
          sed -i 's/android:label="app"/android:label="SomityHub"/' android/app/src/main/AndroidManifest.xml
      - name: Ensure Android Internet permission
        working-directory: apps/mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = 'android.permission.INTERNET'

          if permission not in content:
              marker = "<manifest"
              start = content.find(marker)
              if start < 0:
                  raise SystemExit("AndroidManifest.xml has no <manifest> root element.")
              end = content.find(">", start)
              if end < 0:
                  raise SystemExit("AndroidManifest.xml has an invalid <manifest> root element.")
              content = (
                  content[:end + 1]
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + content[end + 1:]
              )
              manifest.write_text(content, encoding="utf-8")

          check = manifest.read_text(encoding="utf-8")
          if permission not in check:
              raise SystemExit("INTERNET permission was not added.")
          print("Verified: Android INTERNET permission is present.")
          PY

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run widget tests
        working-directory: apps/mobile
        run: flutter test
