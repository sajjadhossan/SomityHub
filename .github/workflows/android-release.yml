name: Android APK Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0 (without v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Flutter app exists
        run: |
          if [ ! -f "apps/mobile/pubspec.yaml" ]; then
            echo "::error::Flutter mobile app is not in the repository yet. Expected apps/mobile/pubspec.yaml. The current repository contains the Next.js web app only."
            exit 1
          fi

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must follow semantic version format, for example 1.0.0"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build split release APKs
        working-directory: apps/mobile
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ github.run_number }}"

      - name: Rename APKs with version
        shell: bash
        run: |
          mkdir -p release-apks
          for apk in apps/mobile/build/app/outputs/flutter-apk/*-release.apk; do
            [ -f "$apk" ] || continue
            filename="$(basename "$apk" -release.apk)"
            cp "$apk" "release-apks/SomityHub-${{ steps.version.outputs.version }}-${filename#app-}.apk"
          done
          ls -lh release-apks

      - name: Upload APKs to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: SomityHub-Android-${{ steps.version.outputs.version }}
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release and attach APKs
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SomityHub v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release-apks/*.apk
