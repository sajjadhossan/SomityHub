name: Android APK Preview and Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version (for example 1.0.0). Leave blank for an automatic preview version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Flutter app exists
        run: |
          test -f "apps/mobile/pubspec.yaml" || {
            echo "::error::Flutter app is missing: apps/mobile/pubspec.yaml"
            exit 1
          }
          test -f "apps/mobile/lib/main.dart" || {
            echo "::error::Flutter entry point is missing: apps/mobile/lib/main.dart"
            exit 1
          }

      - name: Resolve build version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must follow semantic version format, for example 1.0.0"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: apps/mobile
        run: |
          flutter create --platforms=android --org com.somityhub --project-name app .
          sed -i 's/android:label="app"/android:label="SomityHub"/' android/app/src/main/AndroidManifest.xml

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Verify Supabase build variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || {
            echo "::error::Add Actions Variable SUPABASE_URL."
            exit 1
          }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Add Actions Variable SUPABASE_PUBLISHABLE_KEY."
            exit 1
          }

      - name: Build installable Android APKs
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Prepare versioned APK files
        shell: bash
        run: |
          mkdir -p release-apks
          for apk in apps/mobile/build/app/outputs/flutter-apk/*-release.apk; do
            [ -f "$apk" ] || continue
            abi="$(basename "$apk" | sed 's/^app-//; s/-release\.apk$//')"
            cp "$apk" "release-apks/SomityHub-${{ steps.version.outputs.version }}-$abi.apk"
          done
          test -n "$(find release-apks -maxdepth 1 -name '*.apk' -print -quit)" || {
            echo "::error::No APK files were produced."
            exit 1
          }
          ls -lh release-apks

      - name: Upload APKs for preview
        uses: actions/upload-artifact@v4
        with:
          name: SomityHub-APK-preview-${{ steps.version.outputs.version }}-run-${{ github.run_number }}
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: SomityHub v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release-apks/*.apk
