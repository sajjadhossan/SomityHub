name: Android APK Preview and Release

on:
  push:
    branches:
      - main
      - feature/android-cooperative-operations-1-8
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version (for example 1.0.0). Leave blank for an automatic preview version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Test and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Flutter app exists
        run: |
          test -f "apps/mobile/pubspec.yaml" || {
            echo "::error::Flutter app is missing: apps/mobile/pubspec.yaml"
            exit 1
          }
          test -f "apps/mobile/lib/main.dart" || {
            echo "::error::Flutter entry point is missing: apps/mobile/lib/main.dart"
            exit 1
          }

      - name: Resolve build version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="0.1.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version must follow semantic version format, for example 1.0.0"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        working-directory: apps/mobile
        run: |
          flutter create --platforms=android --org com.somityhub --project-name app .
          sed -i 's/android:label="app"/android:label="SomityHub"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          if 'android:scheme="somityhub"' not in content:
              activity = re.search(r'<activity[^>]*MainActivity[^>]*>', content)
              if not activity:
                  raise SystemExit("MainActivity declaration was not found.")
              intent_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="somityhub" android:host="verify" />
                  </intent-filter>'''
              content = content[:activity.end()] + intent_filter + content[activity.end():]
              manifest.write_text(content, encoding="utf-8")
          check = manifest.read_text(encoding="utf-8")
          if 'android:scheme="somityhub"' not in check or 'android:host="verify"' not in check:
              raise SystemExit("SomityHub verification deep-link intent filter was not configured.")
          print("Verified SomityHub custom URI intent filter.")
          PY
      - name: Ensure Android Internet permission
        working-directory: apps/mobile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          permission = 'android.permission.INTERNET'

          if permission not in content:
              marker = "<manifest"
              start = content.find(marker)
              if start < 0:
                  raise SystemExit("AndroidManifest.xml has no <manifest> root element.")
              end = content.find(">", start)
              if end < 0:
                  raise SystemExit("AndroidManifest.xml has an invalid <manifest> root element.")
              content = (
                  content[:end + 1]
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + content[end + 1:]
              )
              manifest.write_text(content, encoding="utf-8")

          check = manifest.read_text(encoding="utf-8")
          if permission not in check:
              raise SystemExit("INTERNET permission was not added.")
          print("Verified: Android INTERNET permission is present.")
          PY

      - name: Configure permanent Android release signing
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Actions Secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/somityhub-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=somityhub-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("android/app")
          kotlin = app / "build.gradle.kts"
          groovy = app / "build.gradle"
          path = kotlin if kotlin.exists() else groovy
          if not path.exists():
              raise SystemExit("Generated Android app Gradle file was not found.")

          source = path.read_text(encoding="utf-8")
          if path.suffix == ".kts":
              if "import java.util.Properties" not in source:
                  source = "import java.util.Properties\n" + source
              loader = (
                  '\nval keystoreProperties = Properties()'
                  '\nval keystorePropertiesFile = rootProject.file("key.properties")'
                  '\nif (keystorePropertiesFile.exists()) {'
                  '\n    keystoreProperties.load(keystorePropertiesFile.inputStream())'
                  '\n}\n'
              )
              if "val keystoreProperties = Properties()" not in source:
                  source = source.replace('\nandroid {', loader + '\nandroid {', 1)
              signing = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
              '''
              if 'create("release")' not in source:
                  source = source.replace("android {", "android {\n" + signing, 1)
              source = re.sub(
                  r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                  'signingConfig = signingConfigs.getByName("release")',
                  source
              )
              release_block = re.search(r'buildTypes\s*\{\s*release\s*\{', source)
              if not release_block:
                  raise SystemExit("Could not locate Android release buildType.")
              if 'signingConfig = signingConfigs.getByName("release")' not in source:
                  pos = release_block.end()
                  source = source[:pos] + '\n            signingConfig = signingConfigs.getByName("release")' + source[pos:]
          else:
              if "keystoreProperties =" not in source:
                  source = "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('key.properties')\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n" + source
              signing = '''
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
              '''
              if "signingConfigs {" not in source:
                  source = source.replace("android {", "android {\n" + signing, 1)
              source = re.sub(r'signingConfig signingConfigs\.debug', 'signingConfig signingConfigs.release', source)
              release_block = re.search(r'buildTypes\s*\{\s*release\s*\{', source)
              if not release_block:
                  raise SystemExit("Could not locate Android release buildType.")
              if "signingConfig signingConfigs.release" not in source:
                  source = source[:release_block.end()] + "\n            signingConfig signingConfigs.release" + source[release_block.end():]

          if "signingConfigs.getByName(\"release\")" not in source and "signingConfig signingConfigs.release" not in source:
              raise SystemExit("Release signing configuration was not applied.")
          path.write_text(source, encoding="utf-8")
          print("Configured permanent release signing.")
          PY
          keytool -list -keystore android/app/somityhub-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Verified permanent Android signing keystore."

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Verify Supabase build variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || {
            echo "::error::Add Actions Variable SUPABASE_URL."
            exit 1
          }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Add Actions Variable SUPABASE_PUBLISHABLE_KEY."
            exit 1
          }

      - name: Build one universal Android APK
        working-directory: apps/mobile
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-name="${{ steps.version.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify permanent APK signing
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK" || { echo "::error::ARM64 APK missing."; exit 1; }
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "::error::Android SDK build-tools apksigner was not found under $SDK_ROOT."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Prepare the single release APK
        run: |
          mkdir -p release
          APK="apps/mobile/build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK" || { echo "::error::Universal APK missing."; exit 1; }
          cp "$APK" release/SomityHub-Android.apk
          ls -lh release/SomityHub-Android.apk

      - name: Publish one APK directly to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-preview-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_type == 'tag' && format('SomityHub v{0}', steps.version.outputs.version) || format('SomityHub Android Preview {0}', github.run_number) }}
          body: "Universal Android APK (ARMv7 + ARM64). Download SomityHub-Android.apk and install on a compatible Android device."
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          generate_release_notes: true
          files: release/SomityHub-Android.apk
