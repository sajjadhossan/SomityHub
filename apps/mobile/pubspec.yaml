name: somityhub_app
description: SomityHub cooperative management mobile application.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.4.1
  cupertino_icons: 1.0.8
  supabase_flutter: 2.9.1
  http: ^1.4.0
  package_info_plus: ^8.3.0
  device_info_plus: 11.4.0
  file_picker: 8.3.7
  url_launcher: ^6.3.1
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3
  pdf: ^3.11.3
  printing: ^5.14.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
dependency_overrides:
  # Keep file_picker's Android subproject compatible with its API 34 compile SDK.
  flutter_plugin_android_lifecycle: 2.0.24
flutter:
  uses-material-design: true
